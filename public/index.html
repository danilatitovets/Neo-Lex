<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neo-Lex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=30" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <div class="brand">Neo-Lex</div>
        <p class="tagline">Юридический помощник по спорам с маркетплейсами</p>
      </div>
      <div class="top-actions">
        <button type="button" id="clear-btn" class="btn-ghost">Очистить диалог</button>
      </div>
    </header>

    <main id="chat" class="chat" aria-live="polite"></main>

    <div id="typing" class="typing" hidden>Юрист печатает…</div>

    <footer class="composer">
      <p id="form-error" class="error" hidden></p>
      <form id="chat-form" class="composer-row">
        <textarea
          id="message"
          rows="1"
          maxlength="4000"
          placeholder="Опишите ситуацию обычным языком"
          required
        ></textarea>
        <button type="submit" id="send-btn" class="btn-primary">Отправить</button>
      </form>
      <button type="button" id="pdf-btn" class="btn-pdf" hidden disabled>
        Сформировать PDF-документ на проверку
      </button>
    </footer>
  </div>
  <script src="/app.js?v=30"></script>
</body>
</html>
