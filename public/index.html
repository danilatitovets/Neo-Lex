<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neo-Lex Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=40" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>Neo-Lex Playground</h1>
        <p class="topbar-sub">Текстовая песочница: system prompt, модель и параметры</p>
      </div>
      <div class="topbar-actions">
        <button type="button" id="reset-settings" class="btn ghost">Сбросить настройки</button>
        <button type="button" id="clear-chat" class="btn ghost">Очистить чат</button>
      </div>
    </header>

    <div class="layout">
      <aside class="settings" id="settings">
        <button type="button" class="settings-toggle" id="settings-toggle" aria-expanded="true">
          Настройки
        </button>

        <div class="settings-body" id="settings-body">
          <label class="field">
            <span class="field-label">System Prompt</span>
            <textarea id="system-prompt" rows="12" maxlength="20000" spellcheck="false"></textarea>
            <div class="field-row">
              <span class="hint" id="prompt-count">0 / 20000</span>
              <button type="button" id="reset-prompt" class="btn link">Сбросить промпт</button>
            </div>
          </label>

          <label class="field">
            <span class="field-label">Модель</span>
            <select id="model"></select>
          </label>

          <label class="field">
            <span class="field-label">Temperature <strong id="temp-value">0.0</strong></span>
            <input id="temperature" type="range" min="0" max="1" step="0.1" value="0" />
          </label>

          <label class="field">
            <span class="field-label">Max Tokens</span>
            <input id="max-tokens" type="number" min="50" max="4000" step="1" value="350" />
          </label>

          <label class="toggle">
            <input id="web-search" type="checkbox" />
            <span>Веб-поиск</span>
          </label>
        </div>
      </aside>

      <section class="chat-panel">
        <div id="chat" class="chat" aria-live="polite"></div>
        <div id="typing" class="typing" hidden>
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span id="typing-label">Генерирую ответ…</span>
        </div>
        <p id="form-error" class="error" hidden></p>
        <form id="chat-form" class="composer">
          <textarea id="message" rows="1" maxlength="4000" placeholder="Введите тестовое сообщение" required></textarea>
          <button type="submit" id="send-btn" class="btn primary">Отправить</button>
        </form>
      </section>
    </div>
  </div>
  <script src="/app.js?v=40"></script>
</body>
</html>
