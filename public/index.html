<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neo-Lex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=38" />
</head>
<body>
  <div class="shell" id="shell">
    <aside class="rail" aria-label="Действия">
      <button type="button" id="clear-btn" class="icon-btn" aria-label="Очистить диалог">
        <span class="icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 20h9" stroke-linecap="round" />
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z" stroke-linejoin="round" />
          </svg>
        </span>
        <span class="btn-label">Очистить</span>
      </button>
    </aside>

    <div class="main">
      <div class="stage">
        <section id="hero" class="hero" aria-label="Neo-Lex">
          <h1 class="hero-title">Neo-Lex</h1>
          <p class="hero-sub">Юридический помощник по спорам с маркетплейсами</p>
        </section>

        <main id="chat" class="chat" aria-live="polite" hidden></main>
      </div>

      <footer class="dock">
        <p id="form-error" class="error" hidden></p>
        <form id="chat-form" class="composer">
          <textarea
            id="message"
            rows="1"
            maxlength="4000"
            placeholder="Опишите ситуацию"
            required
          ></textarea>
          <button type="submit" id="send-btn" class="send" aria-label="Отправить">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </form>
      </footer>
    </div>

    <button
      type="button"
      id="pdf-cta"
      class="pdf-fab"
      hidden
      disabled
      aria-label="Сформировать PDF-документ на проверку"
    >
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z" />
        <path d="M14 3v5h5M8 13h8M8 17h6" stroke-linecap="round" />
      </svg>
      <span>Сформировать PDF-документ на проверку</span>
    </button>
  </div>
  <script src="/app.js?v=38"></script>
</body>
</html>
